<svg width="670" height="670" viewBox="0 0 670 670" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Radial gradient: bright green upper-center → dark green edges -->
    <radialGradient id="bgGrad" cx="50%" cy="35%" r="65%" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#5DBF10"/>
      <stop offset="45%"  stop-color="#3A9200"/>
      <stop offset="100%" stop-color="#1B4800"/>
    </radialGradient>
    <clipPath id="circleClip">
      <circle cx="335" cy="335" r="335"/>
    </clipPath>
  </defs>

  <!-- Main filled circle with gradient -->
  <circle cx="335" cy="335" r="335" fill="url(#bgGrad)"/>

  <!--
    Concentric ring outlines matching Figma node 3:107–3:111
    Centres have slight downward offset (~6–7 px) matching Figma's shadow depth.
    Figma ring radii: 314.5 / 303.5 / 289 / 276
  -->
  <circle cx="335.5" cy="341.5" r="314.5"
          fill="none" stroke="rgba(255,255,255,0.30)" stroke-width="1.5"
          clip-path="url(#circleClip)"/>
  <circle cx="335.5" cy="341.5" r="303.5"
          fill="none" stroke="rgba(255,255,255,0.24)" stroke-width="1.5"
          clip-path="url(#circleClip)"/>
  <circle cx="335"   cy="342"   r="289"
          fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"
          clip-path="url(#circleClip)"/>
  <circle cx="335"   cy="342"   r="276"
          fill="none" stroke="rgba(255,255,255,0.13)" stroke-width="1.5"
          clip-path="url(#circleClip)"/>
</svg>
